<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Apps Malala - IE Malala Yousafzai</title>
    <!-- Importando fuentes elegantes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --line-height: 40px;
            --notebook-bg: #fdfcf4;
            --notebook-line: #c8d8e8;
            --notebook-margin: #e87b7b;
            --primary-color: #1a365d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--notebook-bg);
            /* Creando las líneas del cuaderno usando gradientes CSS */
            background-image: 
                linear-gradient(90deg, transparent 10%, var(--notebook-margin) 10%, var(--notebook-margin) 10.5%, transparent 10.5%),
                repeating-linear-gradient(transparent, transparent 39px, var(--notebook-line) 39px, var(--notebook-line) 40px);
            background-attachment: fixed;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 40px 12%; /* El padding izquierdo compensa la línea roja del cuaderno */
        }

        .banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(5px);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            margin-top: 30px;
            margin-bottom: 50px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            /* Añadiendo una sombra suave al logo para resaltarlo */
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            padding: 20px 0;
        }

        .app-card {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary-color);
            padding: 25px 20px;
            border-radius: 12px;
            font-size: 1.1em;
            font-weight: 600;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border-left: 5px solid #2b6cb0;
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background-color: #2b6cb0;
            transition: width 0.3s ease;
            z-index: 0;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(43, 108, 176, 0.15);
        }

        .app-card:hover::before {
            width: 100%;
        }

        .app-card:hover span {
            color: white;
        }

        .app-card span {
            position: relative;
            z-index: 1;
            transition: color 0.3s ease;
        }

        @media (max-width: 768px) {
            body {
                background-image: 
                    linear-gradient(90deg, transparent 5%, var(--notebook-margin) 5%, var(--notebook-margin) 5.5%, transparent 5.5%),
                    repeating-linear-gradient(transparent, transparent 39px, var(--notebook-line) 39px, var(--notebook-line) 40px);
            }
            .container {
                padding: 15px 15px 30px 8%;
            }
            .banner {
                flex-direction: column;
                text-align: center;
                gap: 15px;
                padding: 20px;
            }
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Banner Superior -->
        <header class="banner">
            <!-- Asegúrate de subir tu imagen como "logo.png" en el mismo lugar que este index.html -->
            <img src="logo.png" alt="Logo IE Malala Yousafzai" class="logo">
            <h1>Mis Apps Malala</h1>
        </header>

        <!-- Cuadrícula de Aplicaciones -->
        <main class="app-grid">
            <a href="CUMPLE/index.html" class="app-card">
                <span>Cumple</span>
            </a>
            <!-- Ruta corregida: Ya no tiene el espacio ni el %20 -->
            <a href="Eco-LIFE/index.html" class="app-card">
                <span>Eco-LIFE</span>
            </a>
            <a href="HORARIOS-DE-CLASE/index.html" class="app-card">
                <span>Horarios de Clase</span>
            </a>
            <a href="MIS-TAREAS/index.html" class="app-card">
                <span>Mis Tareas</span>
            </a>
            <a href="MUSICA/index.html" class="app-card">
                <span>Música</span>
            </a>
            <a href="OBJETOS/index.html" class="app-card">
                <span>Objetos</span>
            </a>
            <a href="ORGANIZA-TU-Futuro/index.html" class="app-card">
                <span>Organiza tu Futuro</span>
            </a>
            <a href="RIEGO/index.html" class="app-card">
                <span>Riego</span>
            </a>
        </main>
    </div>

</body>
</html>
